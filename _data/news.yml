# News & events, newest first. To add one, copy a block below, fill it in,
# and add the photo to assets/images/events/. `date` is just display text,
# not used for sorting — so put the newest item at the top of this file.

- date: 12-13th November 2026
  title: ELPAT Working Groups Meeting in Valencia
  description: >-
    Members of the ELPAT Working Groups met in Valencia, Spain, on 12–13 November 2026, 
    to discuss ongoing activities, share progress, and plan future initiatives
  image: assets/images/events/12Nov2026.jpeg
  image_alt: ELPAT Working Groups Meeting in Valencia
  
- date: 25th June 2026
  title: TRUST Project team meets in Hamburg to advance international collaboration
  description: >-
    On 25 June 2026, members of the TRUST Project met in Hamburg, Germany,
    to continue strengthening our international collaboration and discuss
    the next steps of the project. Discussions also focused on expanding
    our international network and identifying new opportunities for
    collaborative research. Bringing together researchers with diverse
    expertise and perspectives is at the heart of the TRUST Project, and
    meetings like this are essential for building a strong, collaborative
    foundation for future work.
  image: assets/images/events/25Jun2026.jpeg
  image_alt: Team Photo

- date: 22-24th April 2026
  title: XL Congreso Nacional de Coordinadores de Trasplantes
  description: >-
    María Victoria Martínez-López presented a poster outlining the TRUST
    Project, which focuses on the development and validation of an
    instrument to measure public trust in organ donation and
    transplantation systems. The poster presentation also offered an
    opportunity to share the project's current progress—following the
    second round of the Delphi process—and to gather feedback from
    professionals in the field, which will be essential for its further
    development.
  image: assets/images/events/22Apr2026.jpeg
  image_alt: Poster picture

- date: 16-17th April 2026
  title: Knowledge Exchange with Newcastle Hospitals NHS Foundation Trust and ONT
  description: >-
    Organización Nacional de Trasplantes (ONT) hosted a knowledge exchange
    with Newcastle Hospitals NHS Foundation Trust. TRUST project members
    participated in discussions on organ donation practices, sharing the
    Spanish model and experiences. Trust emerged as a key theme,
    highlighting its central role in donation systems and the importance
    of international dialogue.
  image: assets/images/events/16Apr2026.jpeg
  image_alt: Team picture

- date: 9th October 2025
  title: TRUST Team presents at 6th ELPAT Congress
  description: >-
    Our team directed the Focus Session "Public Trust in Organ Donation and
    Transplantation."
